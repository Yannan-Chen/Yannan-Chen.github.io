<!-- Header (links come from _data/navigation.yml; the current page is shown in bold) -->
	<header id="header">
		<h1><a href="index.html">{{ site.header_title }}</a></h1>
		<nav class="links">
			<ul>
				{% for item in site.data.navigation %}
				{% assign item_path = item.url | prepend: "/" %}
				<li><a href="{{ item.url }}">{% if page.url == item_path %}<b>{{ item.title }}</b>{% else %}{{ item.title }}{% endif %}</a></li>
				{% endfor %}
			</ul>
		</nav>
		<nav class="main">
			<ul>
				<li class="menu">
					<a class="fa-bars" href="#menu">Menu</a>
				</li>
			</ul>
		</nav>
	</header>
